<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記帳小幫手</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-sub: #6b7280;
      --border: #e5e7eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      padding: 24px;
    }

    /* 登入區塊樣式 */
    #loginSection {
      text-align: center;
      padding: 32px 16px;
    }

    #loginSection h2 {
      margin: 0 0 8px 0;
      font-size: 24px;
    }

    #loginSection p {
      color: var(--text-sub);
      margin-bottom: 24px;
      font-size: 14px;
    }

    .btn-container {
      display: flex;
      justify-content: center;
    }

    /* 記帳介面樣式 */
    #appSection {
      display: none;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-info img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }

    .user-info .name {
      font-weight: 600;
      font-size: 15px;
    }

    .user-info .email {
      font-size: 12px;
      color: var(--text-sub);
    }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: #f9fafb;
      color: var(--danger);
      border-color: var(--danger);
    }

    /* 總額卡片 */
    .summary-card {
      background: #eef2ff;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-bottom: 20px;
    }

    .summary-title {
      font-size: 13px;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .summary-amount {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
    }

    /* 表單區塊 */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .btn-submit {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    /* 記帳列表 */
    .list-header {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .expense-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 240px;
      overflow-y: auto;
    }

    .expense-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 8px;
      background: #f9fafb;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .expense-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .expense-category {
      font-weight: 600;
    }

    .expense-desc {
      font-size: 12px;
      color: var(--text-sub);
    }

    .expense-action {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .expense-amount {
      font-weight: 600;
      color: var(--text-main);
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      font-size: 16px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .btn-delete:hover {
      color: var(--danger);
      background: #fee2e2;
    }

    .empty-state {
      text-align: center;
      color: var(--text-sub);
      font-size: 13px;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 登入卡片 -->
    <div id="loginSection">
      <h2>記帳小幫手</h2>
      <p>登入 Google 帳戶以同步您的個人記帳資料</p>
      
      <div class="btn-container">
        <div id="g_id_onload"
             data-client_id="274021423976-8u87lhvlg38rpn2kk6rta8vph9pdmjm0.apps.googleusercontent.com"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline"></div>
      </div>
    </div>

    <!-- 記帳主介面 -->
    <div id="appSection">
      <div class="header-bar">
        <div class="user-info">
          <img id="userAvatar" src="" alt="大頭貼">
          <div>
            <div id="userName" class="name"></div>
            <div id="userEmail" class="email"></div>
          </div>
        </div>
        <button class="btn-logout" onclick="handleLogout()">登出</button>
      </div>

      <!-- 總花費看板 -->
      <div class="summary-card">
        <div class="summary-title">總累計支出</div>
        <div class="summary-amount">$ <span id="totalAmount">0</span></div>
      </div>

      <!-- 記帳表單 -->
      <form id="expenseForm" class="form-group" onsubmit="addExpense(event)">
        <div class="form-row">
          <select id="categorySelect" required>
            <option value="餐飲">🍔 餐飲</option>
            <option value="交通">🚗 交通</option>
            <option value="娛樂">🎮 娛樂</option>
            <option value="日常">🛒 日常</option>
            <option value="其他">📦 其他</option>
          </select>
          <input type="number" id="amountInput" placeholder="金額" min="1" required>
        </div>
        <input type="text" id="descInput" placeholder="備註說明 (選填)">
        <button type="submit" class="btn-submit">新增紀錄</button>
      </form>

      <!-- 歷史消費列表 -->
      <div class="list-header">消費明細</div>
      <ul id="expenseList" class="expense-list"></ul>
    </div>
  </div>

  <script>
    let currentUser = null;
    let records = [];

    // 初始化：檢查是否有保存的登入狀態
    window.onload = function() {
      const savedUser = localStorage.getItem("expense_google_user");
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        loadUserData();
      }
    };

    // Google 登入回呼
    function handleCredentialResponse(response) {
      const base64Url = response.credential.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));

      currentUser = JSON.parse(jsonPayload);
      localStorage.setItem("expense_google_user", JSON.stringify(currentUser));
      loadUserData();
    }

    // 載入當前使用者的介面與資料
    function loadUserData() {
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("appSection").style.display = "block";

      document.getElementById("userName").innerText = currentUser.name;
      document.getElementById("userEmail").innerText = currentUser.email;
      document.getElementById("userAvatar").src = currentUser.picture;

      // 讀取該用戶專屬的紀錄（以 Email 作為 key，避免共用電腦混淆）
      const userKey = `records_${currentUser.email}`;
      const savedRecords = localStorage.getItem(userKey);
      records = savedRecords ? JSON.parse(savedRecords) : [];
      renderList();
    }

    // 新增記帳
    function addExpense(e) {
      e.preventDefault();
      const category = document.getElementById("categorySelect").value;
      const amount = Number(document.getElementById("amountInput").value);
      const desc = document.getElementById("descInput").value.trim();

      const newRecord = {
        id: Date.now(),
        category,
        amount,
        desc: desc || "無備註",
        date: new Date().toLocaleDateString()
      };

      records.unshift(newRecord);
      saveRecords();
      renderList();

      document.getElementById("amountInput").value = "";
      document.getElementById("descInput").value = "";
    }

    // 刪除記帳
    function deleteExpense(id) {
      records = records.filter(item => item.id !== id);
      saveRecords();
      renderList();
    }

    // 存入 localStorage
    function saveRecords() {
      const userKey = `records_${currentUser.email}`;
      localStorage.setItem(userKey, JSON.stringify(records));
    }

    // 渲染清單與總額
    function renderList() {
      const listEl = document.getElementById("expenseList");
      const totalEl = document.getElementById("totalAmount");
      listEl.innerHTML = "";

      let total = 0;

      if (records.length === 0) {
        listEl.innerHTML = `<div class="empty-state">目前還沒有任何消費紀錄</div>`;
      } else {
        records.forEach(item => {
          total += item.amount;
          const li = document.createElement("li");
          li.className = "expense-item";
          li.innerHTML = `
            <div class="expense-info">
              <span class="expense-category">${item.category} · $${item.amount}</span>
              <span class="expense-desc">${item.desc} · ${item.date}</span>
            </div>
            <div class="expense-action">
              <button class="btn-delete" title="刪除" onclick="deleteExpense(${item.id})">✕</button>
            </div>
          `;
          listEl.appendChild(li);
        });
      }

      totalEl.innerText = total.toLocaleString();
    }

    // 登出
    function handleLogout() {
      localStorage.removeItem("expense_google_user");
      currentUser = null;
      records = [];

      document.getElementById("appSection").style.display = "none";
      document.getElementById("loginSection").style.display = "block";
      
      // 重新渲染 Google 按鈕
      google.accounts.id.renderButton(
        document.querySelector(".g_id_signin"),
        { theme: "outline", size: "large" }
      );
    }
  </script>
</body>
</html>
