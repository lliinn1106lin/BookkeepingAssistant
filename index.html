<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記帳小幫手</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --danger-hover: #dc2626;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      padding: 24px;
    }

    #loginSection {
      text-align: center;
      padding: 32px 16px;
    }

    #loginSection h2 {
      margin: 0 0 8px 0;
      font-size: 24px;
    }

    #loginSection p {
      color: var(--text-sub);
      margin-bottom: 24px;
      font-size: 14px;
    }

    .btn-container {
      display: flex;
      justify-content: center;
    }

    #appSection {
      display: none;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-info img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }

    .user-info .name {
      font-weight: 600;
      font-size: 15px;
    }

    .user-info .email {
      font-size: 12px;
      color: var(--text-sub);
    }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: #f1f5f9;
      color: var(--danger);
      border-color: var(--danger);
    }

    .summary-card {
      background: #eef2ff;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-bottom: 20px;
    }

    .summary-title {
      font-size: 13px;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .summary-amount {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
      background: #f8fafc;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input, select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    /* 明細品項清單 */
    .items-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    .sub-item-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn-add-item {
      background: #fff;
      border: 1px dashed var(--primary);
      color: var(--primary);
      padding: 8px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .btn-add-item:hover {
      background: #eef2ff;
    }

    .btn-submit {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    /* 歷史紀錄 */
    .list-header {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .expense-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 280px;
      overflow-y: auto;
    }

    .record-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      background: #fff;
    }

    .record-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 6px;
      margin-bottom: 8px;
    }

    .record-title {
      font-weight: 600;
      font-size: 14px;
    }

    .record-date {
      font-size: 12px;
      color: var(--text-sub);
    }

    .sub-item-line {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-sub);
      padding: 2px 0;
    }

    .record-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }

    .total-cost {
      font-weight: 700;
      color: var(--text-main);
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
    }

    .btn-delete:hover {
      color: var(--danger);
    }

    .empty-state {
      text-align: center;
      color: var(--text-sub);
      font-size: 13px;
      padding: 24px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 登入區塊 -->
    <div id="loginSection">
      <h2>記帳小幫手</h2>
      <p>登入 Google 帳戶以同步您的個人記帳資料</p>
      
      <div class="btn-container">
        <div id="g_id_onload"
             data-client_id="274021423976-8u87lhvlg38rpn2kk6rta8vph9pdmjm0.apps.googleusercontent.com"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline"></div>
      </div>
    </div>

    <!-- 記帳主介面 -->
    <div id="appSection">
      <div class="header-bar">
        <div class="user-info">
          <img id="userAvatar" src="" alt="大頭貼">
          <div>
            <div id="userName" class="name"></div>
            <div id="userEmail" class="email"></div>
          </div>
        </div>
        <button class="btn-logout" onclick="handleLogout()">登出</button>
      </div>

      <!-- 總額看板 -->
      <div class="summary-card">
        <div class="summary-title">總累計支出</div>
        <div class="summary-amount">$ <span id="totalAmount">0</span></div>
      </div>

      <!-- 記帳表單 -->
      <form id="expenseForm" class="form-group" onsubmit="saveTransaction(event)">
        <div class="input-row">
          <!-- 日曆選擇器 -->
          <input type="date" id="txDate" required style="flex: 1;">
          <!-- 交易主說明 (例如：全聯採購、晚餐) -->
          <input type="text" id="txTitle" placeholder="交易名稱 (如: 晚餐、好市多)" required style="flex: 2;">
        </div>

        <div style="font-size: 13px; font-weight: 600; margin-top: 4px;">品項明細：</div>
        
        <!-- 動態品項清單容器 -->
        <div id="itemsContainer" class="items-container"></div>

        <button type="button" class="btn-add-item" onclick="addItemRow()">+ 新增明細品項</button>
        <button type="submit" class="btn-submit">儲存此筆交易</button>
      </form>

      <!-- 歷史紀錄 -->
      <div class="list-header">消費明細總覽</div>
      <div id="expenseList" class="expense-list"></div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let records = [];

    // 常用預設類別清單
    const defaultCategories = ["🍔 餐飲", "🚗 交通", "🎮 娛樂", "🛒 日常", "📦 其他", "➕ 自訂其他..."];

    window.onload = function() {
      // 預設日期為當天 (YYYY-MM-DD)
      const today = new Date().toISOString().split('T')[0];
      document.getElementById("txDate").value = today;

      const savedUser = localStorage.getItem("expense_google_user");
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        loadUserData();
      }
    };

    function handleCredentialResponse(response) {
      const base64Url = response.credential.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));

      currentUser = JSON.parse(jsonPayload);
      localStorage.setItem("expense_google_user", JSON.stringify(currentUser));
      loadUserData();
    }

    function loadUserData() {
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("appSection").style.display = "block";

      document.getElementById("userName").innerText = currentUser.name;
      document.getElementById("userEmail").innerText = currentUser.email;
      document.getElementById("userAvatar").src = currentUser.picture;

      const userKey = `records_${currentUser.email}`;
      const savedRecords = localStorage.getItem(userKey);
      records = savedRecords ? JSON.parse(savedRecords) : [];
      
      // 表單初始先塞一條明細
      resetForm();
      renderList();
    }

    // 重設表單並初始化一條明細
    function resetForm() {
      document.getElementById("txTitle").value = "";
      document.getElementById("itemsContainer").innerHTML = "";
      addItemRow();
    }

    // 動態新增單個品項
    function addItemRow() {
      const container = document.getElementById("itemsContainer");
      const div = document.createElement("div");
      div.className = "sub-item-card";

      div.innerHTML = `
        <div class="input-row">
          <input type="text" placeholder="品項 (如: 奶茶)" class="item-name" required style="flex: 2;">
          <input type="number" placeholder="金額" class="item-amount" min="1" required style="flex: 1;">
          <button type="button" class="btn-delete" onclick="removeItemRow(this)">✕</button>
        </div>
        <div class="input-row">
          <select class="item-category" onchange="checkCustomCategory(this)">
            ${defaultCategories.map(c => `<option value="${c}">${c}</option>`).join('')}
          </select>
          <input type="text" placeholder="輸入自訂類型" class="item-custom-category" style="display: none;">
        </div>
      `;

      container.appendChild(div);
    }

    // 刪除品項（至少保留一項）
    function removeItemRow(button) {
      const container = document.getElementById("itemsContainer");
      if (container.children.length > 1) {
        button.closest(".sub-item-card").remove();
      } else {
        alert("一筆交易至少需包含一個品項明細！");
      }
    }

    // 判斷是否選了「自訂其他」
    function checkCustomCategory(select) {
      const customInput = select.parentElement.querySelector(".item-custom-category");
      if (select.value === "➕ 自訂其他...") {
        customInput.style.display = "block";
        customInput.required = true;
        customInput.focus();
      } else {
        customInput.style.display = "none";
        customInput.required = false;
      }
    }

    // 儲存整筆交易（包含日期、標題、所有品項）
    function saveTransaction(e) {
      e.preventDefault();
      const date = document.getElementById("txDate").value;
      const title = document.getElementById("txTitle").value.trim();

      const itemCards = document.querySelectorAll(".sub-item-card");
      const items = [];
      let total = 0;

      itemCards.forEach(card => {
        const name = card.querySelector(".item-name").value.trim();
        const amount = Number(card.querySelector(".item-amount").value);
        const categorySelect = card.querySelector(".item-category").value;
        const customCategory = card.querySelector(".item-custom-category").value.trim();

        // 判定自訂類型或選定類型
        const finalCategory = (categorySelect === "➕ 自訂其他...") 
          ? (customCategory ? `🏷️ ${customCategory}` : "📦 其他") 
          : categorySelect;

        items.push({ name, amount, category: finalCategory });
        total += amount;
      });

      const newRecord = {
        id: Date.now(),
        date,
        title,
        items,
        total
      };

      records.unshift(newRecord);
      saveRecords();
      renderList();
      resetForm();
    }

    function deleteRecord(id) {
      records = records.filter(r => r.id !== id);
      saveRecords();
      renderList();
    }

    function saveRecords() {
      const userKey = `records_${currentUser.email}`;
      localStorage.setItem(userKey, JSON.stringify(records));
    }

    function renderList() {
      const listEl = document.getElementById("expenseList");
      const totalEl = document.getElementById("totalAmount");
      listEl.innerHTML = "";

      let grandTotal = 0;

      if (records.length === 0) {
        listEl.innerHTML = `<div class="empty-state">尚無交易紀錄，趕快記下第一筆吧！</div>`;
      } else {
        records.forEach(rec => {
          grandTotal += rec.total;

          const card = document.createElement("div");
          card.className = "record-card";

          // 組合內部明細清單
          const itemsHtml = rec.items.map(item => `
            <div class="sub-item-line">
              <span>${item.name} <small>(${item.category})</small></span>
              <span>$${item.amount}</span>
            </div>
          `).join('');

          card.innerHTML = `
            <div class="record-header">
              <span class="record-title">${rec.title}</span>
              <span class="record-date">${rec.date}</span>
            </div>
            <div>${itemsHtml}</div>
            <div class="record-footer">
              <span class="total-cost">總計: $${rec.total}</span>
              <button class="btn-delete" title="刪除此紀錄" onclick="deleteRecord(${rec.id})">刪除</button>
            </div>
          `;

          listEl.appendChild(card);
        });
      }

      totalEl.innerText = grandTotal.toLocaleString();
    }

    function handleLogout() {
      localStorage.removeItem("expense_google_user");
      currentUser = null;
      records = [];

      document.getElementById("appSection").style.display = "none";
      document.getElementById("loginSection").style.display = "block";
      
      google.accounts.id.renderButton(
        document.querySelector(".g_id_signin"),
        { theme: "outline", size: "large" }
      );
    }
  </script>
</body>
</html>
