<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記帳小幫手</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="記帳小幫手">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2331/2331941.png">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #16a34a;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .container { width: 100%; max-width: 520px; background: var(--card-bg); border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); padding: 24px; }
    
    #authSection { text-align: center; padding: 20px 8px; }
    .auth-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .auth-tab { flex: 1; padding: 10px; border: none; background: none; font-size: 15px; font-weight: 600; color: var(--text-sub); cursor: pointer; }
    .auth-tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
    .auth-form { display: flex; flex-direction: column; gap: 12px; }
    
    .social-btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .btn-oauth { background: #ffffff; border: 1px solid #cbd5e1; color: var(--text-main); padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn-oauth:hover { background-color: #f1f5f9; }
    .btn-github { background: #24292f; color: #ffffff; border-color: #24292f; }
    .btn-github:hover { background-color: #1a1e22; }
    .btn-anon { background: #f8fafc; border: 1px dashed #94a3b8; color: #475569; }

    .forgot-link { text-align: right; font-size: 12px; color: var(--primary); text-decoration: none; cursor: pointer; }
    .divider { display: flex; align-items: center; text-align: center; margin: 16px 0; color: var(--text-sub); font-size: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border); }
    .divider:not(:empty)::before { margin-right: .5em; }
    .divider:not(:empty)::after { margin-left: .5em; }

    #appSection { display: none; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 16px; }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .user-info img { width: 40px; height: 40px; border-radius: 50%; }
    .user-info .name { font-weight: 600; font-size: 15px; }
    .user-info .email { font-size: 12px; color: var(--text-sub); }
    .header-actions { display: flex; gap: 6px; }
    .btn-header { background: transparent; border: 1px solid var(--border); color: var(--text-sub); padding: 5px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }
    
    .link-status-bar { background: #f1f5f9; padding: 10px 12px; border-radius: 8px; font-size: 12px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .link-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
    .btn-link-action { background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 11px; font-weight: 600; }

    .verify-banner { background: #fef3c7; border: 1px solid #fde68a; border-radius: 8px; padding: 8px 12px; font-size: 12px; color: #92400e; display: none; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .btn-resend-verify { background: #fff; border: 1px solid #d97706; color: #b45309; border-radius: 6px; padding: 3px 8px; font-size: 11px; cursor: pointer; font-weight: 600; }

    .summary-card { background: #eef2ff; border-radius: 12px; padding: 16px; text-align: center; margin-bottom: 16px; }
    .summary-amount { font-size: 28px; font-weight: 700; color: var(--primary); }
    .sync-bar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 16px; color: var(--text-sub); }
    .btn-reload { background: #fff; border: 1px solid var(--border); color: var(--text-sub); border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 12px; }
    
    .search-box { margin-bottom: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; background: #f8fafc; padding: 16px; border-radius: 12px; border: 1px solid var(--border); }
    .input-row { display: flex; gap: 8px; align-items: center; }
    input, select { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; background: #fff; }
    .sub-item-card { background: #ffffff; border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
    .btn-add-item { background: #fff; border: 1px dashed var(--primary); color: var(--primary); padding: 8px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; }
    .btn-submit { background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px; transition: opacity 0.2s; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .record-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #fff; }
    .record-header { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; border-bottom: 1px dashed var(--border); padding-bottom: 6px; margin-bottom: 6px; }
    .record-details { font-size: 13px; color: var(--text-sub); line-height: 1.6; white-space: pre-line; }
    .record-footer { display: flex; justify-content: space-between; align-items: center; font-weight: 700; margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--border); }
    .btn-card-delete { background: #fee2e2; border: 1px solid #fca5a5; color: var(--danger); border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">
    <div id="authSection">
      <h2>記帳小幫手</h2>
      <p style="color: var(--text-sub); font-size: 14px; margin-bottom: 20px;">支援 Email、Google、GitHub 與訪客試用</p>
      
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">登入</button>
        <button class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">註冊帳號</button>
      </div>

      <form class="auth-form" onsubmit="handleEmailAuth(event)">
        <input type="email" id="authEmail" placeholder="電子信箱 (Email)" required>
        <input type="password" id="authPassword" placeholder="密碼 (至少 6 個字元)" minlength="6" required>
        <a class="forgot-link" id="btnForgotPwd" onclick="handleForgotPassword()">忘記密碼？</a>
        <button type="submit" class="btn-submit" id="btnAuthSubmit">立即登入</button>
      </form>

      <div class="divider">或使用快速登入</div>
      <div class="social-btn-group">
        <button class="btn-oauth" type="button" onclick="handleGoogleLogin()">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google">
          以 Google 帳戶繼續
        </button>
        <button class="btn-oauth btn-github" type="button" onclick="handleGitHubLogin()">
          <svg height="18" width="18" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
          </svg>
          以 GitHub 帳戶繼續
        </button>
        <button class="btn-oauth btn-anon" type="button" onclick="handleAnonymousLogin()">
          👤 免註冊訪客快速試用
        </button>
      </div>
    </div>

    <div id="appSection">
      <div class="header-bar">
        <div class="user-info">
          <img id="userAvatar" src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="頭貼">
          <div>
            <div id="userName" class="name"></div>
            <div id="userEmail" class="email"></div>
          </div>
        </div>
        <div class="header-actions">
          <button class="btn-header" id="btnChangePassword" style="display:none;" onclick="handleChangePasswordLoggedIn()">改密碼</button>
          <button class="btn-header" onclick="handleLogout()">登出</button>
        </div>
      </div>

      <!-- Email 未驗證提示橫幅 -->
      <div class="verify-banner" id="verifyBanner">
        <span>⚠️ 信箱尚未完成驗證</span>
        <button class="btn-resend-verify" onclick="handleResendVerification()">重寄驗證信</button>
      </div>

      <!-- 綁定狀態 -->
      <div class="link-status-bar" id="linkStatusBar">
        <div id="linkInfoText">載入綁定狀態...</div>
        <div class="link-buttons" id="linkButtonsContainer"></div>
      </div>

      <div class="summary-card">
        <div style="font-size: 13px; color: var(--primary);">總累計支出</div>
        <div class="summary-amount">$ <span id="totalAmount">0</span></div>
      </div>

      <div class="sync-bar">
        <span id="syncStatus">雲端狀態：就緒</span>
        <button class="btn-reload" onclick="fetchRecordsFromSheets()">🔄 從試算表重新整理</button>
      </div>

      <form class="form-group" id="mainForm" onsubmit="saveTransaction(event)">
        <div class="input-row">
          <input type="datetime-local" id="txDateTime" required style="flex: 1.3;">
          <input type="text" id="txTitle" placeholder="交易名稱" required style="flex: 1.7;">
        </div>
        <div style="font-size: 13px; font-weight: 600;">品項明細：</div>
        <div id="itemsContainer" style="display:flex; flex-direction:column; gap:8px;"></div>
        <button type="button" class="btn-add-item" onclick="addItemRow()">+ 新增明細品項</button>
        <button type="submit" class="btn-submit" id="btnSaveSubmit">儲存並同步至試算表</button>
      </form>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 搜尋交易名稱或品項..." oninput="renderList()">
      </div>

      <div style="font-size: 15px; font-weight: 600; margin-bottom: 12px;">消費明細總覽</div>
      <div id="expenseList"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCH0FXlkIWyzooaF-bc7cQ4GClNHZBUA7E",
      authDomain: "bookkeeping-app-9e1dc.firebaseapp.com",
      projectId: "bookkeeping-app-9e1dc",
      storageBucket: "bookkeeping-app-9e1dc.firebasestorage.app",
      messagingSenderId: "414465795324",
      appId: "1:414465795324:web:e000492cb26487e41b2f0a"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzYo7S7rkkLdEPZx9DxRi3TARmibSIjOvb5Rx1dIVWKIR8J0GfRDbRLvXQ1hRkVMq1q/exec";

    let currentUser = null;
    let records = [];
    let currentAuthMode = "login";
    let isSaving = false; // 防止重複送出的狀態鎖

    const defaultCategories = ["🍔 餐飲", "🚗 交通", "🎮 娛樂", "🛒 日常", "📦 其他", "➕ 自訂其他..."];

    function getCurrentLocalDateTime() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}T${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }

    function getUserSheetIdentifier() {
      if (!currentUser) return "default";
      if (currentUser.isAnonymous) {
        return `訪客_${currentUser.uid.slice(0, 8)}`;
      }
      return currentUser.email || currentUser.uid;
    }

    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        document.getElementById("authSection").style.display = "none";
        document.getElementById("appSection").style.display = "block";
        
        if (user.isAnonymous) {
          document.getElementById("userName").innerText = `訪客 (${user.uid.slice(0, 6)})`;
          document.getElementById("userEmail").innerText = "點擊下方可升級為正式帳號";
          document.getElementById("userAvatar").src = "https://cdn-icons-png.flaticon.com/512/847/847969.png";
          document.getElementById("btnChangePassword").style.display = "none";
          document.getElementById("verifyBanner").style.display = "none";
        } else {
          document.getElementById("userName").innerText = user.displayName || user.email?.split('@')[0] || "使用者";
          document.getElementById("userEmail").innerText = user.email || "(未公開信箱)";
          if (user.photoURL) document.getElementById("userAvatar").src = user.photoURL;

          const hasPassword = user.providerData.some(p => p.providerId === "password");
          document.getElementById("btnChangePassword").style.display = hasPassword ? "inline-block" : "none";

          // 驗證信橫幅控制
          if (user.email && !user.emailVerified) {
            document.getElementById("verifyBanner").style.display = "flex";
          } else {
            document.getElementById("verifyBanner").style.display = "none";
          }
        }

        updateLinkStatusBar();
        resetForm();
        fetchRecordsFromSheets();
      } else {
        currentUser = null;
        document.getElementById("appSection").style.display = "none";
        document.getElementById("authSection").style.display = "block";
      }
    });

    function updateLinkStatusBar() {
      const providers = currentUser.providerData.map(p => p.providerId);
      const isGoogle = providers.includes("google.com");
      const isGithub = providers.includes("github.com");
      const isPassword = providers.includes("password");

      const infoText = document.getElementById("linkInfoText");
      const btnContainer = document.getElementById("linkButtonsContainer");
      btnContainer.innerHTML = "";

      if (currentUser.isAnonymous) {
        infoText.innerHTML = "⚠️ <b>目前為訪客試用狀態</b>（升級綁定後可永久保存）：";
      } else {
        const activeList = [];
        if (isGoogle) activeList.push("Google");
        if (isGithub) activeList.push("GitHub");
        if (isPassword) activeList.push("Email 密碼");
        infoText.innerHTML = `已綁定：<b>${activeList.join("、")}</b>`;
      }

      if (!isGoogle) {
        const btn = document.createElement("button");
        btn.className = "btn-link-action";
        btn.innerText = "🔗 綁定 Google";
        btn.onclick = () => linkProvider(new firebase.auth.GoogleAuthProvider(), "Google");
        btnContainer.appendChild(btn);
      }
      if (!isGithub) {
        const btn = document.createElement("button");
        btn.className = "btn-link-action";
        btn.innerText = "🔗 綁定 GitHub";
        btn.onclick = () => linkProvider(new firebase.auth.GithubAuthProvider(), "GitHub");
        btnContainer.appendChild(btn);
      }
      if (!isPassword) {
        const btn = document.createElement("button");
        btn.className = "btn-link-action";
        btn.innerText = currentUser.isAnonymous ? "✉️ 設定 Email / 密碼" : "🔑 設定密碼登入";
        btn.onclick = linkPassword;
        btnContainer.appendChild(btn);
      }
    }

    async function linkProvider(provider, providerName) {
      try {
        await currentUser.linkWithPopup(provider);
        alert(`🎉 成功綁定 ${providerName}！下次可直接以該方式登入。`);
        updateLinkStatusBar();
      } catch (err) {
        alert("綁定失敗: " + err.message);
      }
    }

    async function linkPassword() {
      let email = currentUser.email;
      if (!email) {
        email = prompt("請輸入要綁定的電子信箱 (Email)：");
        if (!email) return;
      }
      const newPassword = prompt("請設定登入密碼（至少 6 碼）：");
      if (!newPassword || newPassword.length < 6) {
        alert("密碼長度需至少 6 個字元！");
        return;
      }
      const credential = firebase.auth.EmailAuthProvider.credential(email.trim(), newPassword);
      try {
        await currentUser.linkWithCredential(credential);
        alert("🎉 帳號密碼綁定成功！下次可直接用此信箱與密碼登入！");
        updateLinkStatusBar();
      } catch (err) {
        alert("設定失敗: " + err.message);
      }
    }

    // 重新寄送驗證信（加強垃圾信提醒）
    async function handleResendVerification() {
      try {
        await currentUser.sendEmailVerification();
        alert("驗證信已寄出！\n\n📌 提醒：如果收件匣沒有收到，請務必查看「垃圾郵件」或「促銷內容」分類匣！");
      } catch (err) {
        alert("發送失敗: " + err.message);
      }
    }

    // 忘記密碼（加強垃圾信提醒）
    async function handleForgotPassword() {
      const email = document.getElementById("authEmail").value.trim() || prompt("請輸入您的註冊電子信箱 (Email)：");
      if (!email) return;
      try {
        await auth.sendPasswordResetEmail(email.trim());
        alert(`重設密碼信件已成功發送至 ${email}！\n\n📌 提醒：如果收件匣沒有收到，請務必查看「垃圾郵件」或「促銷內容」分類匣！`);
      } catch (err) {
        alert("發送失敗: " + err.message);
      }
    }

    async function handleChangePasswordLoggedIn() {
      const newPassword = prompt("請輸入全新密碼（至少 6 碼）：");
      if (!newPassword || newPassword.length < 6) {
        alert("密碼長度至少需 6 個字元！");
        return;
      }
      try {
        await currentUser.updatePassword(newPassword);
        alert("🎉 密碼已成功更新！");
      } catch (err) {
        if (err.code === "auth/requires-recent-login") {
          alert("基於安全要求，請重新登入後再修改密碼！");
          auth.signOut();
        } else {
          alert("更新失敗: " + err.message);
        }
      }
    }

    function switchAuthTab(mode) {
      currentAuthMode = mode;
      document.getElementById("tabLogin").classList.toggle("active", mode === "login");
      document.getElementById("tabRegister").classList.toggle("active", mode === "register");
      document.getElementById("btnAuthSubmit").innerText = mode === "login" ? "立即登入" : "註冊並啟用";
      document.getElementById("btnForgotPwd").style.display = mode === "login" ? "block" : "none";
    }

    async function handleEmailAuth(e) {
      e.preventDefault();
      const email = document.getElementById("authEmail").value.trim();
      const password = document.getElementById("authPassword").value;

      try {
        if (currentAuthMode === "register") {
          const userCredential = await auth.createUserWithEmailAndPassword(email, password);
          await userCredential.user.sendEmailVerification();
          alert("🎉 註冊成功！驗證信已寄出。\n\n📌 提醒：如果收件匣沒有收到，請務必查看「垃圾郵件」或「促銷內容」分類匣！");
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
      } catch (err) {
        alert("登入/註冊失敗: " + err.message);
      }
    }

    async function handleGoogleLogin() {
      try {
        await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
      } catch (err) {
        alert("Google 登入失敗: " + err.message);
      }
    }

    async function handleGitHubLogin() {
      try {
        await auth.signInWithPopup(new firebase.auth.GithubAuthProvider());
      } catch (err) {
        alert("GitHub 登入失敗: " + err.message);
      }
    }

    async function handleAnonymousLogin() {
      try {
        await auth.signInAnonymously();
      } catch (err) {
        alert("訪客登入失敗: " + err.message);
      }
    }

    function handleLogout() {
      auth.signOut();
    }

    // 核心資料讀取
    function fetchRecordsFromSheets() {
      const statusEl = document.getElementById("syncStatus");
      statusEl.innerText = "⏳ 正在從試算表讀取資料...";
      statusEl.style.color = "#4f46e5";

      const identifier = getUserSheetIdentifier();
      const scriptUrl = `${GAS_API_URL}?email=${encodeURIComponent(identifier)}&callback=handleSheetResponse&_=${Date.now()}`;

      window.handleSheetResponse = function(result) {
        if (result && result.status === "success") {
          records = result.records || [];
          renderList();
          statusEl.innerText = "✅ 已與試算表同步";
          statusEl.style.color = "#16a34a";
        } else {
          statusEl.innerText = "⚠️ 讀取試算表失敗";
          statusEl.style.color = "#dc2626";
        }
      };

      const oldScript = document.getElementById("jsonpScript");
      if (oldScript) oldScript.remove();

      const script = document.createElement("script");
      script.id = "jsonpScript";
      script.src = scriptUrl;
      script.onerror = () => {
        statusEl.innerText = "⚠️ 讀取試算表失敗";
        statusEl.style.color = "#dc2626";
      };
      document.body.appendChild(script);
    }

    function resetForm() {
      document.getElementById("txDateTime").value = getCurrentLocalDateTime();
      document.getElementById("txTitle").value = "";
      document.getElementById("itemsContainer").innerHTML = "";
      addItemRow();
    }

    function addItemRow() {
      const div = document.createElement("div");
      div.className = "sub-item-card";
      div.innerHTML = `
        <div class="input-row">
          <input type="text" placeholder="品項" class="item-name" required style="flex: 2;">
          <input type="number" placeholder="金額" class="item-amount" min="1" required style="flex: 1;">
          <button type="button" style="border:none; background:none; cursor:pointer;" onclick="this.closest('.sub-item-card').remove()">✕</button>
        </div>
        <div class="input-row">
          <select class="item-category" onchange="checkCustomCategory(this)">
            ${defaultCategories.map(c => `<option value="${c}">${c}</option>`).join('')}
          </select>
          <input type="text" placeholder="輸入自訂類型" class="item-custom-category" style="display: none;">
        </div>
      `;
      document.getElementById("itemsContainer").appendChild(div);
    }

    function checkCustomCategory(select) {
      const input = select.parentElement.querySelector(".item-custom-category");
      if (select.value === "➕ 自訂其他...") {
        input.style.display = "block";
        input.required = true;
      } else {
        input.style.display = "none";
        input.required = false;
      }
    }

    // 防重複送出的記帳儲存
    async function saveTransaction(e) {
      e.preventDefault();
      if (isSaving) return; // 若正在儲存中，直接攔截

      const btnSave = document.getElementById("btnSaveSubmit");
      const dateTime = document.getElementById("txDateTime").value;
      const title = document.getElementById("txTitle").value.trim();

      const items = [];
      let total = 0;
      document.querySelectorAll(".sub-item-card").forEach(card => {
        const name = card.querySelector(".item-name").value.trim();
        const amount = Number(card.querySelector(".item-amount").value);
        const sel = card.querySelector(".item-category").value;
        const custom = card.querySelector(".item-custom-category").value.trim();
        const cat = (sel === "➕ 自訂其他...") ? (custom || "其他") : sel;
        items.push({ name, amount, category: cat });
        total += amount;
      });

      const itemsSummary = items.map(i => `${i.name} (${i.category}): $${i.amount}`).join('; ');
      const newRecord = { id: Date.now(), dateTime, title, items, itemsSummary, total };

      // 鎖定按鈕，防止連續點擊
      isSaving = true;
      btnSave.disabled = true;
      btnSave.innerText = "⏳ 正在同步至試算表...";

      const statusEl = document.getElementById("syncStatus");
      statusEl.innerText = "⏳ 正在同步寫入試算表...";
      statusEl.style.color = "#4f46e5";

      try {
        const identifier = getUserSheetIdentifier();
        await fetch(GAS_API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "sync", email: identifier, records: [newRecord] })
        });
        resetForm();
        setTimeout(() => {
          fetchRecordsFromSheets();
          // 解鎖按鈕
          isSaving = false;
          btnSave.disabled = false;
          btnSave.innerText = "儲存並同步至試算表";
        }, 1500);
      } catch (err) {
        statusEl.innerText = "❌ 寫入失敗";
        statusEl.style.color = "#dc2626";
        isSaving = false;
        btnSave.disabled = false;
        btnSave.innerText = "儲存並同步至試算表";
      }
    }

    async function confirmAndDelete(recordId, title, total) {
      if (!confirm(`確定要刪除「${title} ($${total})」嗎？`)) return;
      records = records.filter(r => String(r.id) !== String(recordId));
      renderList();

      try {
        const identifier = getUserSheetIdentifier();
        await fetch(GAS_API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "delete", email: identifier, id: recordId })
        });
      } catch (err) {
        console.error(err);
      }
    }

    function renderList() {
      const listEl = document.getElementById("expenseList");
      const filter = (document.getElementById("searchInput")?.value || "").toLowerCase().trim();
      let total = 0;

      const filtered = records.filter(r => (r.title || "").toLowerCase().includes(filter) || (r.itemsSummary || "").toLowerCase().includes(filter));
      listEl.innerHTML = filtered.length ? "" : `<div style="text-align:center; color:#64748b; font-size:13px; padding:20px;">無交易紀錄</div>`;

      filtered.forEach(r => {
        total += Number(r.total) || 0;
        const div = document.createElement("div");
        div.className = "record-card";
        div.innerHTML = `
          <div class="record-header">
            <span>${r.title}</span>
            <span style="font-size:12px; color:#64748b;">${String(r.dateTime).replace('T', ' ')}</span>
          </div>
          <div class="record-details">${(r.itemsSummary || "").split('; ').join('\n')}</div>
          <div class="record-footer">
            <span>總計: $${r.total}</span>
            <button class="btn-card-delete" onclick="confirmAndDelete('${r.id}', '${r.title}', ${r.total})">🗑️ 刪除</button>
          </div>
        `;
        listEl.appendChild(div);
      });
      document.getElementById("totalAmount").innerText = total.toLocaleString();
    }
  </script>
</body>
</html>
