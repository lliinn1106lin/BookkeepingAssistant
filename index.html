<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記帳小幫手</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .container { width: 100%; max-width: 520px; background: var(--card-bg); border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); padding: 24px; }
    #loginSection { text-align: center; padding: 32px 16px; }
    .btn-container { display: flex; justify-content: center; margin-top: 20px; }
    #appSection { display: none; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 20px; }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .user-info img { width: 40px; height: 40px; border-radius: 50%; }
    .user-info .name { font-weight: 600; font-size: 15px; }
    .user-info .email { font-size: 12px; color: var(--text-sub); }
    .btn-logout { background: transparent; border: 1px solid var(--border); color: var(--text-sub); padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; }
    .summary-card { background: #eef2ff; border-radius: 12px; padding: 16px; text-align: center; margin-bottom: 20px; }
    .summary-amount { font-size: 28px; font-weight: 700; color: var(--primary); }
    .sync-status { font-size: 12px; text-align: center; margin-bottom: 12px; color: var(--text-sub); }
    .form-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; background: #f8fafc; padding: 16px; border-radius: 12px; border: 1px solid var(--border); }
    .input-row { display: flex; gap: 8px; align-items: center; }
    input, select { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; background: #fff; }
    .sub-item-card { background: #ffffff; border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
    .btn-add-item { background: #fff; border: 1px dashed var(--primary); color: var(--primary); padding: 8px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; }
    .btn-submit { background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px; }
    .record-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #fff; }
    .record-header { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; border-bottom: 1px dashed var(--border); padding-bottom: 6px; margin-bottom: 6px; }
    .record-footer { display: flex; justify-content: space-between; font-weight: 700; margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--border); }
  </style>
</head>
<body>

  <div class="container">
    <div id="loginSection">
      <h2>記帳小幫手</h2>
      <p>登入 Google 帳戶以同步專屬雲端試算表</p>
      <div class="btn-container">
        <div id="g_id_onload"
             data-client_id="274021423976-8u87lhvlg38rpn2kk6rta8vph9pdmjm0.apps.googleusercontent.com"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline"></div>
      </div>
    </div>

    <div id="appSection">
      <div class="header-bar">
        <div class="user-info">
          <img id="userAvatar" src="" alt="頭貼">
          <div>
            <div id="userName" class="name"></div>
            <div id="userEmail" class="email"></div>
          </div>
        </div>
        <button class="btn-logout" onclick="handleLogout()">登出</button>
      </div>

      <div class="summary-card">
        <div style="font-size: 13px; color: var(--primary);">總累計支出</div>
        <div class="summary-amount">$ <span id="totalAmount">0</span></div>
      </div>

      <div id="syncStatus" class="sync-status">雲端同步狀態：閒置</div>

      <form class="form-group" onsubmit="saveTransaction(event)">
        <div class="input-row">
          <input type="datetime-local" id="txDateTime" required style="flex: 1.3;">
          <input type="text" id="txTitle" placeholder="交易名稱" required style="flex: 1.7;">
        </div>
        <div style="font-size: 13px; font-weight: 600;">品項明細：</div>
        <div id="itemsContainer" style="display:flex; flex-direction:column; gap:8px;"></div>
        <button type="button" class="btn-add-item" onclick="addItemRow()">+ 新增明細品項</button>
        <button type="submit" class="btn-submit">儲存並同步至試算表</button>
      </form>

      <div style="font-size: 15px; font-weight: 600; margin-bottom: 12px;">消費明細總覽</div>
      <div id="expenseList"></div>
    </div>
  </div>

  <script>
    // ⚠️ 替換成在 Step 2 部署後複製的 Apps Script 網頁應用程式 URL
    const GAS_API_URL = "https://script.google.com/macros/s/替換你的GAS_URL/exec";

    let currentUser = null;
    let records = [];
    const defaultCategories = ["🍔 餐飲", "🚗 交通", "🎮 娛樂", "🛒 日常", "📦 其他", "➕ 自訂其他..."];

    function getCurrentLocalDateTime() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}T${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }

    window.onload = function() {
      const savedUser = localStorage.getItem("expense_google_user");
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        loadUserData();
      }
    };

    function handleCredentialResponse(response) {
      const base64Url = response.credential.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
      currentUser = JSON.parse(jsonPayload);
      localStorage.setItem("expense_google_user", JSON.stringify(currentUser));
      loadUserData();
    }

    function loadUserData() {
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("appSection").style.display = "block";
      document.getElementById("userName").innerText = currentUser.name;
      document.getElementById("userEmail").innerText = currentUser.email;
      document.getElementById("userAvatar").src = currentUser.picture;

      const userKey = `records_${currentUser.email}`;
      records = JSON.parse(localStorage.getItem(userKey) || "[]");
      resetForm();
      renderList();
    }

    function resetForm() {
      document.getElementById("txDateTime").value = getCurrentLocalDateTime();
      document.getElementById("txTitle").value = "";
      document.getElementById("itemsContainer").innerHTML = "";
      addItemRow();
    }

    function addItemRow() {
      const div = document.createElement("div");
      div.className = "sub-item-card";
      div.innerHTML = `
        <div class="input-row">
          <input type="text" placeholder="品項" class="item-name" required style="flex: 2;">
          <input type="number" placeholder="金額" class="item-amount" min="1" required style="flex: 1;">
          <button type="button" style="border:none; background:none; cursor:pointer;" onclick="this.closest('.sub-item-card').remove()">✕</button>
        </div>
        <div class="input-row">
          <select class="item-category" onchange="checkCustomCategory(this)">
            ${defaultCategories.map(c => `<option value="${c}">${c}</option>`).join('')}
          </select>
          <input type="text" placeholder="輸入自訂類型" class="item-custom-category" style="display: none;">
        </div>
      `;
      document.getElementById("itemsContainer").appendChild(div);
    }

    function checkCustomCategory(select) {
      const input = select.parentElement.querySelector(".item-custom-category");
      if (select.value === "➕ 自訂其他...") {
        input.style.display = "block";
        input.required = true;
      } else {
        input.style.display = "none";
        input.required = false;
      }
    }

    async function saveTransaction(e) {
      e.preventDefault();
      const dateTime = document.getElementById("txDateTime").value;
      const title = document.getElementById("txTitle").value.trim();

      const items = [];
      let total = 0;
      document.querySelectorAll(".sub-item-card").forEach(card => {
        const name = card.querySelector(".item-name").value.trim();
        const amount = Number(card.querySelector(".item-amount").value);
        const sel = card.querySelector(".item-category").value;
        const custom = card.querySelector(".item-custom-category").value.trim();
        const cat = (sel === "➕ 自訂其他...") ? (custom || "其他") : sel;
        items.push({ name, amount, category: cat });
        total += amount;
      });

      const newRecord = { id: Date.now(), dateTime, title, items, total };
      records.unshift(newRecord);
      localStorage.setItem(`records_${currentUser.email}`, JSON.stringify(records));
      renderList();
      resetForm();

      // 同步到 Google 試算表
      syncToGoogleSheets([newRecord]);
    }

    async function syncToGoogleSheets(newRecords) {
      const statusEl = document.getElementById("syncStatus");
      statusEl.innerText = "⏳ 正在同步至 Google 試算表...";
      statusEl.style.color = "#4f46e5";

      try {
        await fetch(GAS_API_URL, {
          method: "POST",
          mode: "no-cors", // Apps Script 跨網域標準寫法
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "sync",
            email: currentUser.email,
            records: newRecords
          })
        });
        statusEl.innerText = "✅ 試算表同步完成！";
        statusEl.style.color = "#16a34a";
      } catch (err) {
        statusEl.innerText = "❌ 同步失敗，資料已暫存於本機";
        statusEl.style.color = "#dc2626";
      }
    }

    function renderList() {
      const listEl = document.getElementById("expenseList");
      let total = 0;
      listEl.innerHTML = records.length ? "" : `<div style="text-align:center; color:#64748b; font-size:13px; padding:20px;">無交易紀錄</div>`;

      records.forEach(r => {
        total += r.total;
        const div = document.createElement("div");
        div.className = "record-card";
        div.innerHTML = `
          <div class="record-header">
            <span>${r.title}</span>
            <span style="font-size:12px; color:#64748b;">${r.dateTime.replace('T', ' ')}</span>
          </div>
          ${r.items.map(i => `<div style="display:flex; justify-content:space-between; font-size:13px; color:#64748b;"><span>${i.name} (${i.category})</span><span>$${i.amount}</span></div>`).join('')}
          <div class="record-footer"><span>總計</span><span>$${r.total}</span></div>
        `;
        listEl.appendChild(div);
      });
      document.getElementById("totalAmount").innerText = total.toLocaleString();
    }

    function handleLogout() {
      localStorage.removeItem("expense_google_user");
      currentUser = null;
      document.getElementById("appSection").style.display = "none";
      document.getElementById("loginSection").style.display = "block";
      google.accounts.id.renderButton(document.querySelector(".g_id_signin"), { theme: "outline", size: "large" });
    }
  </script>
</body>
</html>
