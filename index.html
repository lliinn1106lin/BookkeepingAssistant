<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>會員系統</title>
</head>
<body>
  <h2>會員登入 / 註冊</h2>
  <input type="text" id="username" placeholder="帳號"><br><br>
  <input type="password" id="password" placeholder="密碼"><br><br>
  <button onclick="sendData('login')">登入</button>
  <button onclick="sendData('register')">註冊</button>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxXNfCilAaZMnPHTNFS3Y2SQ5CsF8tjphgGwvySkFs4I8gA30KkhNjh0vUv0y8-m-JrMA/exec";

    function sendData(action) {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!username || !password) {
        alert("請輸入完整帳號密碼");
        return;
      }

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action, username, password })
      })
      .then(res => res.json())
      .then(data => alert(data.msg))
      .catch(err => alert("連線錯誤，請確認網路或 API 設定"));
    }
  </script>
</body>
</html>
